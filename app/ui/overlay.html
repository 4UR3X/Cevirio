<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin:0; width:100%; height:100%; background:transparent; overflow:hidden }
    #box { box-sizing:border-box; width:100%; height:100%; display:flex; align-items:center; justify-content:center; text-align:center;
           background:rgba(10,12,18,.9); color:#fff; font-family:Segoe UI, sans-serif; font-weight:600; padding:6px 10px; border-radius:6px; line-height:1.25; word-break:break-word }
  </style>
</head>
<body>
  <div id="box"></div>
  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const box = document.getElementById("box");

    function fit() {
      let size = 64;
      box.style.fontSize = size + "px";
      while (size > 10 && (box.scrollHeight > box.clientHeight || box.scrollWidth > box.clientWidth)) {
        size -= 2;
        box.style.fontSize = size + "px";
      }
    }

    function set(text) { box.textContent = text; fit(); }

    invoke("get_last_translation").then(set);
    listen("translation", e => { if (e.payload.text) set(e.payload.text); });
    window.addEventListener("resize", fit);
  </script>
</body>
</html>
