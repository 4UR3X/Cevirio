<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>Çevirio</title>
  <style>
    body { font-family: Segoe UI, sans-serif; background:#12141a; color:#e8e8ee; margin:0; padding:24px; min-height:100vh; box-sizing:border-box }
    h1 { margin:0 0 4px } .sub { opacity:.65; margin:0 0 20px }
    button { background:#6c63ff; color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:15px; cursor:pointer }
    button:hover { background:#7d75ff }
    select { background:#2a2d38; color:#e8e8ee; border:0; border-radius:8px; padding:9px 12px; font-size:14px; margin-left:12px }
    kbd { background:#2a2d38; border-radius:4px; padding:2px 6px }
    #preview { margin-top:20px; max-width:100%; max-height:35vh; border:1px solid #2a2d38; border-radius:8px; display:none }
    #status { margin-top:14px; opacity:.7 }
    #text { margin-top:12px; background:#1b1e27; border:1px solid #2a2d38; border-radius:8px; padding:12px; white-space:pre-wrap; min-height:60px; display:none }
  </style>
</head>
<body>
  <h1>Çevirio</h1>
  <p class="sub" id="info">Yükleniyor…</p>
  <button id="go">Bölge seç</button>
  <select id="lang" title="OCR dili"></select>
  <span style="margin-left:12px;opacity:.7"><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>X</kbd></span>
  <div id="status"></div>
  <img id="preview" alt="Yakalanan bölge" />
  <div id="text"></div>
  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const $ = id => document.getElementById(id);

    invoke("app_info").then(i => { $("info").textContent = `v${i.version} · ${i.os}/${i.arch}`; });

    invoke("ocr_languages").then(list => {
      const sel = $("lang");
      sel.innerHTML = "";
      sel.append(new Option("Otomatik (sistem dilleri)", ""));
      list.forEach(l => sel.append(new Option(`${l.name} (${l.tag})`, l.tag)));
    }).catch(() => {});

    $("lang").addEventListener("change", e => invoke("set_ocr_lang", { tag: e.target.value }));
    $("go").addEventListener("click", () => invoke("start_capture"));

    listen("captured", e => {
      const img = $("preview");
      img.src = e.payload;
      img.style.display = "block";
      img.onload = () => { $("status").textContent = `Yakalandı: ${img.naturalWidth}×${img.naturalHeight} px · OCR çalışıyor…`; };
      $("text").style.display = "none";
    });

    listen("ocr_result", e => {
      const box = $("text");
      box.style.display = "block";
      if (e.payload.error) {
        $("status").textContent = "OCR hatası";
        box.textContent = e.payload.error;
      } else {
        $("status").textContent = "OCR tamamlandı";
        box.textContent = e.payload.text || "(metin bulunamadı)";
      }
    });
  </script>
</body>
</html>
