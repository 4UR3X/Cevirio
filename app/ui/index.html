<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>Çevirio</title>
  <style>
    body { font-family: Segoe UI, sans-serif; background:#12141a; color:#e8e8ee; margin:0; padding:24px; min-height:100vh; box-sizing:border-box }
    h1 { margin:0 0 4px } .sub { opacity:.65; margin:0 0 20px }
    button { background:#6c63ff; color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:15px; cursor:pointer }
    button:hover { background:#7d75ff }
    kbd { background:#2a2d38; border-radius:4px; padding:2px 6px }
    #preview { margin-top:20px; max-width:100%; max-height:60vh; border:1px solid #2a2d38; border-radius:8px; display:none }
    #status { margin-top:14px; opacity:.7 }
  </style>
</head>
<body>
  <h1>Çevirio</h1>
  <p class="sub" id="info">Yükleniyor…</p>
  <button id="go">Bölge seç</button>
  <span style="margin-left:12px;opacity:.7">veya <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>X</kbd></span>
  <div id="status"></div>
  <img id="preview" alt="Yakalanan bölge" />
  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;

    invoke("app_info").then(i => {
      document.getElementById("info").textContent = `v${i.version} · ${i.os}/${i.arch}`;
    });

    document.getElementById("go").addEventListener("click", () => invoke("start_capture"));

    listen("captured", e => {
      const img = document.getElementById("preview");
      img.src = e.payload;
      img.style.display = "block";
      img.onload = () => {
        document.getElementById("status").textContent = `Yakalandı: ${img.naturalWidth}×${img.naturalHeight} px`;
      };
    });
  </script>
</body>
</html>
