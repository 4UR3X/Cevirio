[package]
name = "cevirio"
version = "0.1.0"
description = "Cevirio - hızlı ekran çeviri aracı"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9.8"
tauri-plugin-global-shortcut = "2.4.0"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true
