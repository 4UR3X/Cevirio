[package]
name = "cevirio"
version = "0.1.0"
description = "Cevirio - hızlı ekran çeviri aracı"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
xcap = "0.9.8"
tauri-plugin-global-shortcut = "2.4.0"
base64 = "0.23.1"
image = { version = "0.25.10", default-features = false, features = ["png"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "query", "rustls"] }
futures-util = "0.3.34"

[profile.release]
lto = true
opt-level = 3
codegen-units = 1
strip = true

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Media_Ocr", "Graphics_Imaging", "Globalization", "Storage_Streams", "Foundation_Collections", "Foundation"] }

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }
